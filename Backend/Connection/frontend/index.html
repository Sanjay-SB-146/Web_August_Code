<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Login</h1>
    <form id="LoginForm">
        Name:<input type="text" placeholder="Enter your Name" id="name">
        <br><br>
        Email:<input type="email" placeholder="Enter your email" id="email">
         <br><br>
        <button type="submit">Login</button>

        <p id="res"></p>
    </form>

    <script>
        document.getElementById("LoginForm").addEventListener('submit',function(event){
            event.preventDefault() //Avoid Reloading of page/form

            name = document.getElementById("name").value
            email = document.getElementById("email").value

            //Connection - To Backend
            fetch('http://localhost:3000/login',{
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({name,email})
            })
            .then(response => response.json())
            .then(data => document.getElementById('res').textContent = data.message)

            .catch(error => console.error('Error',error))
        })
    </script>
</body>
</html>
