<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // 1. Airthematic operator - +, - , / , * , %

    let x = 10
    let y = 5

    console.log(x+y)
    console.log(x-y)
    console.log(x*y)
    console.log(x/y)
    console.log(x%y)

    // 2. Assignment operator - =
    let score = 5
    score += 5
    score -= 1
    console.log(score)

    // 3. Comparrision operator - boolean data type
    let a = 10
    let b = 8
    console.log(a>b)
    console.log(a<b)
    console.log(a>=b)
    console.log(a<=b)

    // == it only checks value
    let height1 = 100
    let height2 = "100"

    console.log(height1 == height2) // true

    // === it checks both value and data type
    console.log(height1 === height2) // false

    // Logical operators - AND , OR , NOT

    //AND - Both conditions true then output is true
    let isMember = false
    let TotalBill = 1000

    console.log(isMember && TotalBill >= 800)

    //OR - atleast 1 condition is true
    console.log(isMember || TotalBill >= 800)

    // ! - flip/opp value

    let NetflixSubb = false
    console.log(!NetflixSubb)

    </script>
</body>
</html>
