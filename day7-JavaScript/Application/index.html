<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Draw a dice and find the Lucky no

        let luckyNo = Math.floor(Math.random() * 6) + 1
        // console.log(luckyNo)

        while(true){
           let guessNo = prompt("Enter Your Number Between (1-6)")
           if(guessNo == luckyNo){
              alert("You Won The Game")
              break;
           }else{
             alert("Better Luck Next Time")
           }
        }
    </script>
</body>
</html>
