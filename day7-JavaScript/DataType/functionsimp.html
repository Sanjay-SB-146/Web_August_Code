<!DOCTYPE html>

<body>
    <script>
        // Function - used to do specific task
        
        //1. Basic function
        function Greet(){
            console.log("Good Evening User")
        }
        Greet()
        
        //2. function with parameter
        function Greeting(name){
            console.log("Good Evening "+ name)
        }
        Greeting("Sanjay")
        Greeting("Aman")

        //3. function with return keyword

        function Add(a,b){
            return a+b
        }
        let result = Add(10,5)
        console.log(result)

    </script>
