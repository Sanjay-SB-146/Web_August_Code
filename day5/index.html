<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aqua;
            width: 300px;
            height: 300px;
            text-align: center;

            border: 1px solid black;
            border-radius: 10px;
            margin: 20px;
            padding: 20px;

            box-sizing: border-box;

        }
    </style>
</head>
<body>
    <div class="box">
        <p>Hello Guys</p>
    </div>

    <div class="box">
        <p>Hello Students</p>
    </div>
</body>
</html>
