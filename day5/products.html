<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            height: 100vh;
            background-color: #f9f9f9;
            

            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;


        }

        .product{
            border: 1px solid black;
            border-radius: 12px;
            width: 250px;
            height: 300px;
            padding: 12px;
            margin-bottom: 15px;

            text-align: center;

            /*box-shadow: Xaxis Yaxis Soread-Radius colorName;*/

            box-shadow: 4px 4px 8px black;
        }
        .product:hover{
            background-color: #ff0000;
            transition: 2s;
            transform: scale(1.03);
            color: white;

        }

        .product img{
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;

        }
        .product button{
            background-color: orange;
            padding: 10px;
            border-radius: 12px;
            border: none;
            width: 90%;

        }
    </style>
</head>
<body>
    <div class="product">
        <img src="https://media.istockphoto.com/id/1315356912/photo/beoplay-h6-headphone.jpg?b=1&s=612x612&w=0&k=20&c=jIRHb41KI-2fDdQbALeP-3P75nkaFHFzl32CvyjnNQU=" height="150" width="150">
        <h2>Headphone</h2>
        <p>Rs 2,499</p>
        <button>Buy Now</button>
    </div>
    
    <div class="product">
        <img src="https://images.pexels.com/photos/7262750/pexels-photo-7262750.jpeg" height="150" width="150">
        <h2>Pista</h2>
        <p>Rs 500</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://media.istockphoto.com/id/2212665802/photo/close-up-on-laptop-with-white-blank-isolated-screen-display-on-table-over-the-luxury-private.jpg?b=1&s=612x612&w=0&k=20&c=YX_iRwhk2sG5TDmU9VpSITEGCwMgcm3YuXoZAuduIJs=" height="150" width="150">
        <h2>Laptop</h2>
        <p>Rs 2,50,000</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/569062/pexels-photo-569062.png" height="150" width="150">
        <h2>Mobile</h2>
        <p>Rs 9,999</p>
        <button>Buy Now</button>
    </div>
</body>
</html>
