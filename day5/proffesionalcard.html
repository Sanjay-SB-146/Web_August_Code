<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            box-sizing: border-box;
            width: 320px;
            border: 1px solid grey;
            border-radius: 10px;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 10px;
            margin: 30px auto;
            background-color: aquamarine;
            text-align: center;
        }
        div button{
            background-color:chocolate;
            border: none;
            border-radius: 5px;
            align-items: center;
            padding: 5px;
        }
        #name{
            color:red;
        }
        .card:hover{
            background-color:#05696B;
            color: white;
            transition: 1.5s;
        }
       
    </style>
</head>
<body>
    <div class="card">
        <h2 id="name"><u>Sai Training Center</u></h2>
        <h2>Web Development</h2>
        <p> 
            • HTML<br>
            • CSS<br>
            • JavaScript 
        </p>
        <h3>Contact : 8867744695, 9740856504</h3>
    </div>
</body>
</html>
