<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       #div1 h2{
            color: red;
        }
        #div2 h2{
            color: blue;
        }
    </style>
</head>
<body>
    <!-- child inside a parent-->
    <div id="div1">
        <h2>This is heading inside Div</h2>
        <button>Greet</button>
    </div>

    <div id="div2">
        <h2>This is heading inside Div - 2</h2>
        <button>Greet</button>
    </div>

    <h2>This is Outside</h2>
</body>
</html>
